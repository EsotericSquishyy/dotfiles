$config = $HOME/.config/hypr
source = $config/colors.conf

$bg          = $background
$transparent = rgba(ffffff00)
$text        = $base01
$subtext     = $base02
$fail        = $base03

$font        = Mononoki Nerd Font

# ==============================================================================
# GENERAL SETTINGS
# ==============================================================================

general {
    hide_cursor = true
}

# ==============================================================================
# BACKGROUND
# ==============================================================================

background {
    monitor =
    immediate_render = true
    color = $bg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

# ==============================================================================
# TIME/DATE
# ==============================================================================

# Time display
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 80
    font_family = $font
    # position = 0, 630
    position = 0, 42%
    halign = center
    valign = center
}

# Date display
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %d %B %Y"
    color = $text
    font_size = 20
    font_family = $font
    position = 0, 37%
    halign = center
    valign = center
}

# ==============================================================================
# COMPLIMENTS
# ==============================================================================

# https://github.com/ASHRREAL/config/
label {
    monitor =
    text = cmd[update:8000] printf '%s\n' 'Hey there handsome, you'\''re doing great today' 'You'\''re such a good boy, I'\''m really happy with you' 'Aww look at you working so hard, that'\''s my boy' 'You'\''re being so good right now, I love it' 'Such a sweet boy, you always make me smile' 'You'\''re doing everything right today, good job' 'I'\''m so happy to see you being such a good boy' 'You'\''re working so hard, that makes me really happy' 'Such a good listener, you'\''re the best' 'You'\''re being so responsible, I love that about you' 'Look at you being such a good boy today' 'You'\''re doing amazing, keep being awesome' 'Such a hardworking boy, you make me so happy' 'You'\''re being so obedient today, good job baby' 'I love watching you succeed, you'\''re doing great' 'You'\''re such a good boy, always trying your best' 'Aww you'\''re being so good right now' 'Such a sweet hardworking boy, I adore you' 'You'\''re making me so happy just by being you' 'Good job today baby, you'\''re doing everything right' 'You'\''re such a good listener, that'\''s my boy' 'I'\''m really happy with how good you'\''re being' 'Such a responsible boy, you always impress me' 'You'\''re working so well today, good job sweetie' '💎 Look at my good boy being so focused' 'You'\''re doing such a good job, I'\''m really pleased' 'Such a good boy, always making the right choices' 'You'\''re being so wonderful today, keep it up' 'I love how hard you'\''re working, good boy' 'You'\''re such a sweet obedient boy, perfect as always' | shuf -n1
    color = $subtext
    font_size = 24
    font_family = $font
    position = 0, -45%
    halign = center
    valign = center
    text_align = center
}

# ==============================================================================
# AVATAR
# ==============================================================================

Avatar
image {
    monitor =
    path = $config/profile_pics/hoodie_mouse.jpg
    size = 150
    rounding = -1
    position = 0, 7%
    halign = center
    valign = center
    border_color = $transparent
}

# ==============================================================================
# WELCOME MESSAGE
# ==============================================================================

label {
    monitor =
    text = $USER
    color = $text
    font_size = 32
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
}

# ==============================================================================
# INPUT FIELD
# ==============================================================================

input-field {
    monitor =
    size = 380, 65
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $text
    inner_color = $transparent
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false
    check_color = $text
    fail_color = $fail
    fail_text = Failed! ($ATTEMPTS)
    position = 0, -7%
    halign = center
    valign = center
}
